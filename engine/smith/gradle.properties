# A Smith sandbox's Gradle settings, copied to /home/smith/.gradle/gradle.properties by
# smith/Dockerfile. The Gradle user home's file wins over engine/gradle.properties (-Xmx4g,
# parallel), which got Gradle OOM-killed in the 3 GiB sandbox. Sized for one test class at a time
# (`gradle :engine-<module>:test --tests <Class> --no-daemon --offline`, engine/README.md "Smith
# runs"): a 1 GiB Gradle JVM, the Kotlin compiler inside it (no separate Kotlin daemon), one worker
# and one test fork (the test JVM's 768m heap is engine/build.gradle.kts').
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
engine.test.forks=1
