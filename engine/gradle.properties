# Sized for the 8 vCPU frakworks-build runner and 16+ modules compiling in parallel in one JVM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
# In-process on purpose: the build runs --no-daemon in a fresh container, so a Kotlin daemon would
# be one more JVM to start and warm per build; Kotlin shares the Gradle heap above instead.
kotlin.compiler.execution.strategy=in-process
# The build cache (in GRADLE_USER_HOME, the Dockerfile's /gradle-cache mount on the build runners)
# lets a build skip a compile whose inputs an earlier build already compiled: a test-only change
# reuses the main classes, an engine change the sdk's. CI also pushes to and pulls from the shared
# remote cache (settings.gradle.kts, GRADLE_REMOTE_CACHE_URL), so a hit does not depend on which
# buildkitd the build landed on.
org.gradle.caching=true
# Build independent modules (engine/modules, sdk) concurrently on the build runner's cores.
org.gradle.parallel=true
