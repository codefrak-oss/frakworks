# Layered over src/main/resources/application.properties for every test (Spring Boot reads
# classpath:/config/ after classpath:/, so only these keys change). The doctor's tick stays off,
# so no test's flows are ticked on a clock; DoctorTickTest turns it on and calls Doctor.tick by hand. The friction
# grouper's pokes stay off the same way: FrictionGrouperTest drains by hand, and FrictionGrouperWakeTest turns them on.
# The job ticker's clock stays off too: JobTickerTest calls JobTicker.tick by hand.
engine.doctor.enabled=false
engine.friction.group-enabled=false
engine.jobs.tick-enabled=false
# H2 has no LISTEN/NOTIFY: the tests' engine relays its events to no one (EventRelay; PostgresEventRelayTest drives the real one).
engine.events.relay=noop
