spring.application.name=engine
server.port=8080
# A refusal's reason in the error body ("anthropic refused it (401): ..."): the
# desktop app shows it. Every reason the engine writes is safe to show; none
# carries a credential. Spring Boot 4's name; server.error.* is Boot 3's and does nothing here.
spring.web.error.include-message=always
# One database, two owners (engine/README.md, "Its own tables"): Operaton's
# ACT_* tables and Flyway's history in the default schema, ours in `engine`,
# which db/migration creates and fills. The local stack points this at Postgres; here
# (tests, running outside Docker) it is in-memory H2. Not H2's Postgres mode:
# Operaton's H2 schema script fails in it (BLOB), so migrations stay portable SQL.
# One H2 database per Spring context (`${random.uuid}` resolves per context), dropped when
# its pool closes: the test build caps the context cache (engine/build.gradle.kts), and an
# evicted context sharing one named database with DB_CLOSE_DELAY=-1 closed it under every
# other context ("The database has been closed", 64 failures on 2026-09-25 after #200).
spring.datasource.url=jdbc:h2:mem:engine-${random.uuid}
# The engine's database connections (Hikari; Spring's default is 10). On 2026-10-06 a batch of
# 21 intakes plus their Smiths' collects, scans and the desktop's reads held all ten and the API
# stopped answering; 30 leaves room under a burst, well inside engine-db's max_connections (100).
spring.datasource.hikari.maximum-pool-size=30
# Fail fast and say who held it (#1650, engine/README.md "Database pool"): a request that cannot get a connection
# within 5 s answers 503 (PoolExhausted), well under a client's 30 s, instead of hanging; a connection held
# 30 s is logged at warn with the stack that took it.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000
# Operaton's tables may already be there: baseline below V1 so ours still run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
operaton.bpm.database.schema-update=true
# `full` so GET /intake/{id} can read an ended intake's steps and variables.
operaton.bpm.history-level=full

# Smith runs (engine/README.md). The sandbox is a sibling container started
# over the Docker socket; every value here is overridable from the environment
# (ENGINE_SMITH_IMAGE, ENGINE_SMITH_NETWORK, ...).
engine.smith.sandbox=docker
# The Smith image, pulled from the LAN registry (engine/README.md, "Smith runs"
# and "Images"). Missing locally: pulled before the sandbox is created, a
# failure or a pull past image-pull-timeout fails the start into an incident.
# A mutable tag on a registry (:main) is re-pulled at most once per
# image-refresh-interval (PT0S: every run); a failed refresh keeps the local copy.
# Default: the local build's registry-less tag (engine/compose.build.yaml),
# never pulled or refreshed. A registry is opt-in: compose.local.yaml sets
# <FRAKWORKS_REGISTRY>/frakworks-smith:main when FRAKWORKS_REGISTRY is set.
engine.smith.image=frakworks-smith:main
engine.smith.image-refresh-interval=PT5M
engine.smith.image-pull-timeout=PT5M
engine.smith.network=
# 3 GiB: a Smith must be able to run the engine suite (gradle test) in its
# sandbox, and at 2 GiB the OOM killer took the Gradle daemon (2026-09-25).
# The Docker VM has 5.8 GiB; engine is limited to 2 GiB and engine-db to 1 GiB,
# both with oom_score_adj -500 while sandboxes get +500, so under a squeeze the
# kernel kills a Smith first (engine/README.md, "Smith runs").
engine.smith.memory-bytes=3221225472
# 2 CPUs (Docker NanoCpus) per sandbox: on 2026-09-26 five concurrent Smiths on
# the 4-CPU VM, one running gradle test at ~270% CPU, stalled the engine 81 s
# (Hikari thread starvation, /health timed out). engine and engine-db also get
# cpu_shares 4096 against a sandbox's default 1024 (engine/README.md).
engine.smith.cpus=2
# The tier whose model, effort and account a first-mate session pod runs on, as the desktop's First mate
# defaults to (engine/README.md, "First-mate sessions").
engine.firstmate.tier=8
# The engine's URL as a sandbox reaches it on engine.smith.network, passed to
# the Smith as ENGINE_URL for the frakworks MCP server (engine/README.md, "The
# frakworks server in a Smith"). A URL, not a credential. Blank: no server.
engine.smith.engine-url=
# How a run learns its sandbox exited (engine/README.md, "Smith runs"): Docker's
# die events, with a backstop scan at startup, after a stream reconnect, and
# every exit-scan-interval. `engine.smith.exit-scan.enabled=false` turns the
# subscription and the scans off (the tests do, and scan by hand).
engine.smith.exit-scan-interval=PT3M
engine.smith.exit-scan.enabled=true
engine.docker.host=unix:///var/run/docker.sock
# The Kubernetes hosting model (engine/README.md, "Hosting models"); which
# model new runs use, and the cluster's namespace, image and engine URL, are
# rows of engine.engine_setting (PUT /settings/smith-hosting), not properties.
# The kubeconfig the engine reaches the k3s cluster with: a file mounted
# read-only (compose.local.yaml mounts engine/kube/, gitignored). Absent: no
# Kubernetes run starts, and Docker runs go on.
engine.smith.k8s.kubeconfig=/etc/frakworks/kube/config
# The Job's activeDeadlineSeconds: past it the cluster kills the pod.
engine.smith.k8s.active-deadline=PT24H
# The turn budget (SMITH_TURNS) a mode `parent` run gets: one live parent session spans its
# whole split (#100042; engine/docs/smith-runs.md, "Turn budget"). Every other mode keeps
# run-smith.sh's 200.
engine.smith.parent-turns=1000
# Where the engine reaches Anthropic to verify a credential (CredentialVerifier);
# tests point it at a stub.
engine.anthropic.upstream=https://api.anthropic.com
# Where it reaches Jev (TypeSafe) for the same: GET /v1/models, which spends no credits.
engine.jev.upstream=https://api.typesafe.ai
# Where it reaches OpenAI for the same.
engine.openai.upstream=https://api.openai.com
# The model a live run is summarized on (engine/README.md, "Summarize: a live run summarized").
engine.summarize.model=claude-haiku-4-5
# The engine's own Jev calls (HttpJevDecider, engine/README.md "Jev accounts"):
# the model pinned (jev-latest moves), a per-attempt timeout, and a bounded
# backoff on 429/529 (500 ms, then 1 s; 3 attempts in all).
engine.jev.model=jev-1.13.0
engine.jev.timeout-ms=5000
engine.jev.attempts=3
engine.jev.backoff-ms=500
# The noul at or above which a rejected acceptance answer is asked again
# ("Did you mean accepted?") instead of ending not accepted. Only feature instances
# started before #583 still ask the user for acceptance; kept until none is left.
engine.jev.acceptance-threshold=0.9
# The confidence at or above which Jev's pick of a proposal decision is taken
# (engine/README.md "Proposal"); higher for accept and build (auto), which
# file a feature and start work. Below it the rule reads the answer.
engine.jev.decision-floor=0.8
engine.jev.decision-build-floor=0.95
# The confidence at or above which Jev's reading of a failed engine check as
# infrastructure or flaky re-runs it, once per round (engine/README.md
# "Chore"). Below it, or with no answer, the finding goes to the work.
engine.jev.ci-triage-floor=0.8
# The confidence at or above which Jev's pick of a refined ticket's kind,
# feature mode or tier is filed (engine/README.md "Intake"). Below it, or with
# no answer, the refiner's choice stands for that field.
engine.jev.refine-floor=0.8
# The confidence at or above which Jev's reading of an incident as `retry`
# retries it at once when the user presses Fix, with no Smith run
# (engine/README.md "Fix and Propose a fix"). Below it, or with any other
# pick or no answer, the Fix Smith runs as before.
engine.jev.incident-triage-floor=0.9
# The confidence at or above which Jev's match of an intake ask to an open
# ticket puts a question to the user before the refine (engine/README.md
# "Intake", "Is this ask already a ticket?"). Below it, or with no answer, the
# intake refines as before.
engine.jev.duplicate-floor=0.9
# The confidence at or above which Jev's match of a new doctor sighting to one
# of the engine-defects repo's bugs lumps it there (engine/README.md "Doctor",
# use case doctor-sighting). Below it, `new` or no answer, the doctor files it
# through intake as before.
engine.jev.doctor-sighting-floor=0.9
# How many times `new`'s probability the winning cluster of near-duplicate
# groups must hold for a friction note with a new key to join it
# (engine/README.md "Friction notes", use case friction-group): the summed
# probability at least this ratio of new's, and above it. Otherwise the note
# founds a group of its own; no answer leaves it for the grouper's retry. The
# call row's threshold holds this ratio, so /jev/summary's floor shows it.
engine.jev.friction-group-beats-new=2.0
# The `two-things` noul value at or above which a friction note is marked as
# describing two different things (engine/README.md "Friction notes", "Two
# things": the question rides on the friction-group call, or is a call of its
# own, use case friction-two-things). Below it nothing but the call is written;
# no answer is no mark and is not retried.
engine.jev.friction-two-things=0.8
# Set for the engine's /anthropic proxy, which streamed Smith replies back
# for up to 10 minutes: unset, Tomcat's 30s default cut long replies off
# mid-body (#89, #90, 2026-09-25). The proxy is gone (the usage meter is read
# from the sandbox's meter.json now, engine/README.md "The usage meter"). The
# one asynchronous endpoint today, GET /events (engine/README.md "Events"),
# does not rely on this: its SseEmitter is created with its own no-timeout
# value (SseEmitter(0L)), since a stream completed every 10 minutes is no
# stream. Kept, not dropped: it is inert for synchronous requests, and the
# next streamed or long-polled endpoint that forgets to set its own would
# otherwise silently inherit the 30s cutoff.
spring.mvc.async.request-timeout=600000

# The job ticker (engine/README.md, "Custom jobs and the SDK"): once a second, every job whose
# every signal is due is started unless its last run still runs. false: no tick (the tests'
# properties; JobTickerTest calls JobTicker.tick by hand).
engine.jobs.tick-enabled=true
# The doctor (engine/README.md, "Doctor"): every interval, each running
# ticket whose position is the same as at the last tick and that waits on
# nothing legitimate gets one health-check Smith run, recorded in
# engine.doctor_run (GET /doctor/history). false: no tick (ENGINE_DOCTOR_ENABLED).
engine.doctor.enabled=true
engine.doctor.interval=PT1M
# How long a place (a ticket's root and leaves) is backed off after its last
# doctor run, when its last 3 runs ended failed or its last sighting is lumped
# into a bug not yet fixed: no new run starts there until it has passed.
engine.doctor.backoff=PT6H
# The friction grouper (engine/README.md, "Friction notes"): a note gets its
# exact key at insert and is grouped afterwards by one worker thread. false:
# no scheduled poke and no poke from an insert (the tests' properties; a test
# drains by hand). group-interval is how often the scheduled poke wakes the
# worker, the backstop for a note written just before a restart or one whose
# retry has come round; group-give-up is how long after a note was written a
# run of no answers from Jev ends with the note founding its own group.
engine.friction.group-enabled=true
engine.friction.group-interval=PT1M
engine.friction.group-give-up=PT24H
# How often the doctor's filed bugs are brought in step with their closes on
# GitHub (fixed, declined, a duplicate's signatures moved).
engine.doctor.bug-sync=PT10M

# The key AI account credentials are sealed with in engine.ai_account
# (engine/README.md, "AI accounts"): 32 bytes, base64 (ENGINE_SECRETS_KEY).
# Unset, the engine runs but PUT /accounts/{name}/credential answers 503.
engine.secrets.key=

# GitHub: no token is configured here. Each target repo's token is sealed on
# its engine.target_repo row (PUT /repos/{owner}/{name}/token; engine/README.md,
# "Each repo's token"), and a repo without one cannot be worked.
# Where the engine reaches GitHub's REST API, and the host it pushes to over git.
engine.github.api-url=https://api.github.com
engine.github.git-url=https://github.com

# Starting flows from labelled issues (engine/README.md, "Starting a flow from
# an issue"): a scan at startup, on each wake (a GitHub delivery to
# POST /hooks/github, below), on POST /scan, and on each repo's own scan
# interval, which is not configured here: it is scan_interval_minutes on the
# repo's engine.target_repo row (PATCH /repos/{owner}/{name}; engine/README.md,
# "When it scans"). false turns off the startup scan and the interval scans,
# not the wakes (the tests).
engine.scan.enabled=true
# GitHub's webhook deliveries (POST /hooks/github) wake a scan too. Their secret
# is not configured here: each target repo's is sealed on its engine.target_repo
# row (PUT /repos/{owner}/{name}/webhook-secret; engine/README.md, "When it scans").
# A second scan this long after each wake: GitHub's labelled-issues listing
# lags a label by a few seconds. Logged when it catches something.
engine.wake.follow-up=PT15S

# The engine check (engine/README.md, "Chore": `wait for the engine check`):
# a repo's engine.target_repo row (ci_check, ci_paths; POST/PATCH /repos) is
# the only source; a row with no ci_check has no check. The timeout bounds the
# wait; past it, an incident.
engine.ci-check.timeout=PT3H
# A check with no run on the pushed head (GitHub dropped the pull_request
# event) is re-triggered by closing and reopening the PR: this long after the
# wait begins and between tries, at most this many times per wait. A run that
# has started, however slow, is never re-triggered.
engine.ci-check.retrigger-after=PT20M
engine.ci-check.retriggers=2
# false turns every check off (ENGINE_CI_CHECK_ENABLED): the runner-outage switch.
engine.ci-check.enabled=true

# The live transcript and smith_run_active (engine/README.md, "Transcripts and
# the live-run gauge"): each live sandbox's stdout goes to VictoriaLogs'
# /insert/jsonline, one row per line, and GET /metrics serves the gauge for
# VictoriaMetrics to scrape. Empty logs-url: no rows (ENGINE_TELEMETRY_LOGS_URL,
# e.g. http://victorialogs:9428). metrics.enabled=false: /metrics answers 404.
# A failure here is a WARN, never a failed run.
engine.telemetry.logs-url=
engine.telemetry.metrics.enabled=true
engine.telemetry.timeout=PT5S
# What read_transcript on POST /mcp/frakworks reads back (engine/README.md,
# "Engine-served MCP servers"): the rows above from logs-url, and smith_run_active from
# VictoriaMetrics at metrics-url (ENGINE_TELEMETRY_METRICS_URL, e.g.
# http://victoriametrics:8428). Empty logs-url: the tool says the transcript
# store is not configured; empty metrics-url: whether a run is live is unknown.
engine.telemetry.metrics-url=
engine.telemetry.query-timeout=PT10S

# The HITLP server the engine files its flow waits on as a requester (#2447;
# codefrak-oss/hitlp spec/hitlp.md section 7; hitlp/HitlpRequester.kt). Its MCP
# endpoint and bearer token are settings in the database
# (engine.hitlp_server, set with PUT /settings/hitlp; #2500), not properties:
# a flow wait that reaches the requester with none set fails naming that call.
# timeout: connect and request, for the requester. No poll
# interval: the leaseholder keeps the server's task stream open
# (hitlp/HitlpTaskStream.kt, #2463).
engine.hitlp.timeout=PT10S

# The git commit this image was built from, reported as `commit` on GET /version
# (engine/README.md, "Images"). images.yml passes it as the Dockerfile's GIT_SHA,
# which the runtime stage sets as ENGINE_BUILD_COMMIT; empty (a local build): null.
engine.build.commit=${ENGINE_BUILD_COMMIT:}
# The repo this image was built from (owner/name; the Dockerfile's GIT_REPO as
# ENGINE_BUILD_REPO). DeployedChecks answers "is this commit deployed?" for it
# from engine.build.commit, and the engine posts a deploy event for it at every
# start with its commit ("Deploys"); empty: neither. Not a default repo: it names
# the one repo whose production is this engine.
engine.build.repo=${ENGINE_BUILD_REPO:}
# Replicas (engine/README.md, "Replicas and the lease"): how the event bus reaches the other replicas. postgres
# (LISTEN/NOTIFY on the engine's database) is the engine's; noop is the tests' (src/test/resources/config), as H2 has
# no NOTIFY. A lone engine needs nothing set: it takes the lease and relays to no one.
engine.events.relay=postgres
# A rollout (two replicas, deploy/k8s/base/engine.yaml) stops a pod gracefully: requests in flight finish, the lease
# is released first (EngineLease stops first), the job executor drains, then the context closes.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
