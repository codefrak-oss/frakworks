# The web version's static files at /web/ (observability/desktop/README.md, "Web version"). They hold no data and need
# no token; every engine call the page makes goes to its own origin, where the Ingress sends everything but /web/ to the
# engine. Only the bundle's files are served; anything else is 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # The page's relative asset paths need the slash.
    location = /web { return 302 /web/; }

    location /web/ {
        index index.html;
        add_header Cache-Control "no-cache" always;
        # `$uri/` lets `index` answer /web/ itself (a directory).
        try_files $uri $uri/ =404;
    }

    # The readiness probe's path, inside the namespace only (the Ingress routes /web/ alone here).
    location = /healthz { access_log off; return 200 "ok\n"; }

    location / { return 404; }
}
