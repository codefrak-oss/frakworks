# The web version of the desktop app (observability/desktop/README.md, "Web
# version"): image `frakworks-web`, nginx serving `npm run build:web`'s
# dist-web/ at /web/. Static files only, no data, no secret: it talks to
# nothing. The Ingress below sends <host>/web/ here and the overlay's engine
# Ingress sends the rest of the host to the engine, so the page and the API
# share one origin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: frakworks
  labels: {app.kubernetes.io/name: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: frakworks-web:main
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: frakworks
spec:
  selector: {app.kubernetes.io/name: web}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# <host>/web/ to the web Service. No host here: the overlay patches in the
# same host (and TLS) as its engine Ingress, so the URL users reach is
# <engine-url>/web/ as before. The controller picks the longest matching
# path, so /web goes here and everything else to the engine.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: frakworks
spec:
  rules:
    - http:
        paths:
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
